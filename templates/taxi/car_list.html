{% extends "base.html" %}

{% block content %}
<h1>Cars: </h1>
  {% if car_list %}
    <ul>
    {% for car in car_list %}
      <li><a href="{% url 'taxi:car-detail' car.id %}"><strong>Car id: </strong> {{ car.id }}</a>, <strong>Model name: </strong>{{ car.model }}, <strong>manufacturer: </strong>{{ car.manufacturer.name }}
      </li>
    {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
