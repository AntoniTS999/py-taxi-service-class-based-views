{% extends "base.html" %}

{% block content %}
  {% if car_list %}
    <table>
    <thead>Cars: </thead>
    {% for car in car_list %}
      <td><a href="{% url 'taxi:car-detail' car.id %}"><strong>Car id: </strong> {{ car.id }}</a>, <strong>Model name: </strong>{{ car.model }}, <strong>manufacturer: </strong>{{ car.manufacturer.name }}
      </td>
      {% empty %}
      <p>No Cars</p>
    {% endfor %}
    </table>
  {% endif %}
{% endblock %}
