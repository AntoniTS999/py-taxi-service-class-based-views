{% extends "base.html" %}

{% block content %}
  {% if driver_list %}
    <table>
      <thead>Drivers: </thead>
    {% for driver in driver_list %}
      <td><a href="{% url 'taxi:driver-detail' driver.id %}"><strong>username: </strong>{{ driver.username }}</a>, <strong>licence number: </strong>{{ driver.license_number }}
      </td>
      {% empty %}
      <p>No drivers</p>
    {% endfor %}
    </table>
  {% endif %}
{% endblock %}
