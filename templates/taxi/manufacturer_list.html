{% extends "base.html" %}

{% block content %}
<h1>Manufacturers: </h1>
  {% if manufacturer_list %}
    <ul>
    {% for manufacturer in manufacturer_list %}
      <li><strong>Company name: </strong>{{ manufacturer.name }}, <strong>country: </strong>{{ manufacturer.country }}</li>
    {% endfor %}
    </ul>
  {% endif %}
{% endblock %}
