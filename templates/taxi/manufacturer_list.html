{% extends "base.html" %}

{% block content %}
  {% if manufacturer_list %}
    <table
    ><thead>Manufacturers: </thead>
    {% for manufacturer in manufacturer_list %}
      <td><strong>Company name: </strong>{{ manufacturer.name }}, <strong>country: </strong>{{ manufacturer.country }}</td>
      {% empty %}
      <p>No manufacturer</p>
    {% endfor %}
    </table>
  {% endif %}
{% endblock %}
